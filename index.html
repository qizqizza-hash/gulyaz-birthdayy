<!DOCTYPE html>

<body>

    <!-- Səhnə 1 -->

        <div class="cat">🐈</div>

        <h1>Salam, Gülyaz! 🌸</h1>

        <p>
            Mən <strong>Momo</strong>.<br><br>

        <button onclick="nextScene()">

    </div>

    <!-- Səhnə 2 -->

        <div class="cat">🐈</div>

        <h1>Bir dəqiqə... 🤭</h1>

        <p>
            Mən əmin olmaq istəyirəm...
            <br><br>
            Sən doğrudan da Gülyazsan? 💖
        </p>

        <button onclick="yesIam()">
            Bəli, mənəm ✨
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
